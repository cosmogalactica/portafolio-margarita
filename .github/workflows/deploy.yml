name: Build Production Dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Commit & Push Compiled Dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: build production dist"
          branch: main
          file_pattern: "dist/*"
